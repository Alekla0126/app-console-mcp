[project]
name = "app-console-mcp"
version = "0.1.1"
description = "Google Play Console, App Store Connect and AdMob from the terminal or from Claude (MCP), without opening a browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Lagunes" }]
requires-python = ">=3.10"
keywords = ["mcp", "google-play", "app-store-connect", "admob", "claude", "fastlane", "aso", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mcp>=1.10",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "requests>=2.28",
    "PyJWT[crypto]>=2.8",
    "google-play-scraper>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
appconsole = "app_console_mcp.cli:main"
app-console-mcp = "app_console_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Alekla0126/app-console-mcp"
Issues = "https://github.com/Alekla0126/app-console-mcp/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_console_mcp"]

[tool.uv]
# rebuild the cached `uvx --from <dir>` install whenever the sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
